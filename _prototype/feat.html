<style>
    html {
        scroll-behavior: smooth;
        color-scheme: dark;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Geist", system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    img {
        display: block;
        max-width: 100%;
        height: auto;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
    }

    .tools {
        border-block: 1px solid var(--line);
        padding: 36px 0;
        overflow: hidden;
    }

    .marquee {
        display: flex;
        width: max-content;
    }

    .marquee__track {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: clamp(48px, 7vw, 96px);
        margin: 0;
        padding: 0 clamp(24px, 3.5vw, 48px);
        list-style: none;
        animation: marquee 40s linear infinite;
    }

    .marquee__track img {
        height: 28px;
        width: auto;
        opacity: 0.8;
    }

    @keyframes marquee {
        to {
            transform: translateX(-100%);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }

        .hero {
            height: auto;
        }

        .marquee {
            width: auto;
        }

        .marquee__track {
            animation: none;
            flex-wrap: wrap;
        }

        .marquee__track[aria-hidden="true"] {
            display: none;
        }

        .js .reveal {
            opacity: 1;
            transform: none;
            transition: none;
        }

        .project__media img,
        .btn {
            transition: none;
        }
    }
</style>
